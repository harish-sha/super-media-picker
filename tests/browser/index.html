<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Media Picker no-bundler fixture</title>
    <link rel="stylesheet" href="/fixture/hostile.css" />
    <script src="/npm/super-media-picker@candidate/dist/browser/super-media-picker.global.js"></script>
  </head>
  <body>
    <main class="fixture-shell">
      <h1>No-bundler browser SDK fixture</h1>
      <p id="fixture-status">Loading browser SDK…</p>
      <output id="event-log" aria-live="polite"></output>

      <div class="fixture-grid">
        <section class="fixture-panel" aria-label="Declarative fixture">
          <h2>Declarative custom element</h2>
          <super-media-picker
            id="declarative-picker"
            allow-expand
            height="480"
            mode="compact"
            motion="none"
            placement="bottom-start"
            storage-namespace="browser-declarative"
            theme="dark"
            width="380"
          ></super-media-picker>
        </section>

        <section class="fixture-panel" aria-label="ES module fixture">
          <h2>ES module controller</h2>
          <div id="esm-target" class="fixture-target"></div>
        </section>

        <section class="fixture-panel" aria-label="Global fixture">
          <h2>Global controller</h2>
          <div id="global-target" class="fixture-target"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/fixture/fixture.js"></script>
  </body>
</html>
